# Pile locale : une base par service, Kafka, collecteur OpenTelemetry, Jaeger v2, services et conteneur web.
# Secrets : variables d'environnement (fichier .env généré par `make secrets`, jamais versionné).
# En cas de conflit sur le poste (port ou sous-réseau déjà pris), NB_PORT_IDENTITE_CLIENTS, NB_PORT_COEUR_BANCAIRE,
# NB_PORT_NOTIFICATIONS, NB_PORT_AUDIT et NB_SOUS_RESEAU remplacent les valeurs par défaut (8081, 8082, 8085, 8086,
# 172.30.0.0/24).
name: next-banking-webapp

networks:
  nb:
    ipam:
      config:
        - subnet: ${NB_SOUS_RESEAU:-172.30.0.0/24}

volumes:
  pgdata-identite-clients:
  pgdata-coeur-bancaire:
  pgdata-notifications:
  pgdata-audit:

services:
  postgres-identite-clients:
    image: postgres:18.6
    environment:
      TZ: Europe/Paris
      POSTGRES_DB: identite_clients
      POSTGRES_USER: identite_clients
      POSTGRES_PASSWORD: ${NB_IDENTITE_CLIENTS_BD_MOT_DE_PASSE:-}
    volumes:
      - pgdata-identite-clients:/var/lib/postgresql
    networks: [nb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identite_clients -d identite_clients"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-coeur-bancaire:
    image: postgres:18.6
    environment:
      TZ: Europe/Paris
      POSTGRES_DB: coeur_bancaire
      POSTGRES_USER: coeur_bancaire
      POSTGRES_PASSWORD: ${NB_COEUR_BANCAIRE_BD_MOT_DE_PASSE:-}
    volumes:
      - pgdata-coeur-bancaire:/var/lib/postgresql
    networks: [nb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coeur_bancaire -d coeur_bancaire"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-notifications:
    image: postgres:18.6
    environment:
      TZ: Europe/Paris
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${NB_NOTIFICATIONS_BD_MOT_DE_PASSE:-}
    volumes:
      - pgdata-notifications:/var/lib/postgresql
    networks: [nb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-audit:
    image: postgres:18.6
    environment:
      TZ: Europe/Paris
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${NB_AUDIT_BD_MOT_DE_PASSE:-}
    volumes:
      - pgdata-audit:/var/lib/postgresql
    networks: [nb]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    environment:
      TZ: Europe/Paris
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks: [nb]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config/otelcol/config.yaml:/etc/otelcol/config.yaml:ro
    networks: [nb]
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      # Image sans shell : la santé se vérifie en validant la configuration montée.
      test: ["CMD", "/otelcol", "validate", "--config", "/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    environment:
      TZ: Europe/Paris
    ports:
      - "16686:16686"
    networks: [nb]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  identite-clients:
    build:
      context: .
      dockerfile: services/identite-clients/Dockerfile
    environment:
      TZ: Europe/Paris
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-identite-clients:5432/identite_clients
      SPRING_DATASOURCE_USERNAME: identite_clients
      SPRING_DATASOURCE_PASSWORD: ${NB_IDENTITE_CLIENTS_BD_MOT_DE_PASSE:-}
      # Paire RSA du jeton (DER en base64), dérivée de .secrets/ par `make secrets` ; sans elle, refus de démarrer.
      NB_JETON_CLE_PRIVEE: ${NB_JETON_CLE_PRIVEE:-}
      NB_JETON_CLE_PUBLIQUE: ${NB_JETON_CLE_PUBLIQUE:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # X-Forwarded-For n'est retenu que d'un mandataire de ce réseau (le conteneur web) ; même plage que le réseau nb.
      # Un appel direct sur le port publié arrive par la passerelle de ce réseau : son en-tête est donc aussi retenu
      # (ports de développement uniquement).
      NB_RESEAU_MANDATAIRES_DE_CONFIANCE: ${NB_SOUS_RESEAU:-172.30.0.0/24}
    ports:
      - "${NB_PORT_IDENTITE_CLIENTS:-8081}:8080"
    networks: [nb]
    depends_on:
      postgres-identite-clients:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  coeur-bancaire:
    build:
      context: .
      dockerfile: services/coeur-bancaire/Dockerfile
    environment:
      TZ: Europe/Paris
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-coeur-bancaire:5432/coeur_bancaire
      SPRING_DATASOURCE_USERNAME: coeur_bancaire
      SPRING_DATASOURCE_PASSWORD: ${NB_COEUR_BANCAIRE_BD_MOT_DE_PASSE:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Clé publique du jeton : tout /api/** est authentifié sauf le témoin ; sans elle, refus de démarrer.
      NB_JETON_CLE_PUBLIQUE: ${NB_JETON_CLE_PUBLIQUE:-}
      # Adresse IP d'origine de l'audit : même plage de confiance qu'identite-clients (le conteneur web).
      NB_RESEAU_MANDATAIRES_DE_CONFIANCE: ${NB_SOUS_RESEAU:-172.30.0.0/24}
      # Décalage de l'horloge réglée (durée ISO-8601), lu seulement en profil rejeu (compose.rejeu.yaml) ; vide sinon.
      HORLOGE_DECALAGE: ${HORLOGE_DECALAGE:-}
    ports:
      - "${NB_PORT_COEUR_BANCAIRE:-8082}:8080"
    networks: [nb]
    depends_on:
      postgres-coeur-bancaire:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    environment:
      TZ: Europe/Paris
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notifications:5432/notifications
      SPRING_DATASOURCE_USERNAME: notifications
      SPRING_DATASOURCE_PASSWORD: ${NB_NOTIFICATIONS_BD_MOT_DE_PASSE:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${NB_PORT_NOTIFICATIONS:-8085}:8080"
    networks: [nb]
    depends_on:
      postgres-notifications:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      # Le topic est déclaré par son producteur (bean NewTopic) : il existe avant la souscription.
      coeur-bancaire:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    environment:
      TZ: Europe/Paris
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-audit:5432/audit
      SPRING_DATASOURCE_USERNAME: audit
      SPRING_DATASOURCE_PASSWORD: ${NB_AUDIT_BD_MOT_DE_PASSE:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Clé publique du jeton : tout /api/** est authentifié ; sans elle, refus de démarrer.
      NB_JETON_CLE_PUBLIQUE: ${NB_JETON_CLE_PUBLIQUE:-}
    ports:
      - "${NB_PORT_AUDIT:-8086}:8080"
    networks: [nb]
    depends_on:
      postgres-audit:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      # Les topics identite-clients.audit.v1 et coeur-bancaire.audit.v1 sont déclarés par leur producteur (bean NewTopic) :
      # ils existent avant la souscription.
      identite-clients:
        condition: service_healthy
      coeur-bancaire:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      TZ: Europe/Paris
    ports:
      - "8080:8080"
    networks: [nb]
    depends_on:
      identite-clients:
        condition: service_healthy
      coeur-bancaire:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20
