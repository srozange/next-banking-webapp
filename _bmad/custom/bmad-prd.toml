  "file:{project-root}/docs/retro/tools/retro-coverage-review.md",
  "Relecteur « conformité des écarts au corpus », sur tout le PRD, fonctionnalité par fonctionnalité. Pour chaque FR, lis la ou les RG citées sur sa ligne Source dans {project-root}/docs/retro/features/FEAT-NNN/RG.md. Si la FR diffère de la RG (seuil, condition, effet, message), elle doit être marquée comme écart volontaire, citer la RG exacte concernée et donner sa raison ; sinon finding critical. Vérifie aussi que chaque décision du memlog ({doc_workspace}/.memlog.md) qui mentionne une RG cite la bonne RG (texte de la RG conforme à ce que dit la décision) et a été appliquée au PRD ; sinon finding critical.",
