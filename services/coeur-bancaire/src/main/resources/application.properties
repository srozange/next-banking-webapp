spring.application.name=coeur-bancaire
nb.fuseau=Europe/Paris
server.port=8080

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-coeur-bancaire:5432/coeur_bancaire
spring.datasource.username=coeur_bancaire

# Kafka : chaînes JSON, sans en-tête de type.
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
# Kafka injoignable : l'observation de l'envoi demande l'identifiant du cluster dans le fil de la requête ;
# délais bornés pour que le POST réponde bien avant le délai de nginx (60 s).
spring.kafka.admin.operation-timeout=3s
spring.kafka.admin.properties.request.timeout.ms=3000
spring.kafka.admin.properties.default.api.timeout.ms=3000
# Consommateur du topic interne coeur-bancaire.virement-a-traiter.v1 : groupe = identifiant du service.
spring.kafka.consumer.group-id=coeur-bancaire
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.type=single

# Tracing : export OTLP vers le collecteur, échantillonnage complet, observation Kafka.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}]\u0020

# Adresse IP d'origine (audit) : X-Forwarded-For n'est retenu que d'un mandataire de cette plage (réseau compose, AD-6) ;
# liste de CIDR séparés par des virgules, remplacée par NB_RESEAU_MANDATAIRES_DE_CONFIANCE. Plage illisible : refus de démarrer.
nb.reseau.mandataires-de-confiance=172.30.0.0/24

# Seuils du virement (NFR-SEC-08), validés au démarrage : un seuil nul ou négatif empêche le démarrage.
# seuil-attente : montant à partir duquel un virement exécuté est PENDING (opérations « [EN ATTENTE] ») ;
# seuil-alerte : montant à partir duquel la notification est une ALERTE (story 3.3).
nb.fraude.seuil-attente=5000
nb.fraude.seuil-alerte=5000
# seuil-fraude : montant à partir duquel un virement est suspendu avant tout débit, quel que soit son score (FR-023-04) ;
# acces-historique.delai : délai au-delà duquel l'accès à l'historique du contrôle est en erreur (le virement est alors
# refusé pour erreur de contrôle, sans débit). Un seuil ou un délai nul ou négatif empêche le démarrage.
nb.fraude.seuil-fraude=10000
nb.fraude.acces-historique.delai=2s

# Contrôle de fraude du virement (FEAT-027, NFR-SEC-08), validé au démarrage : une valeur absente, nulle ou négative
# empêche le démarrage. Score cumulé au-delà duquel des alertes sont écrites ; seuils de LARGE_AMOUNT (40 puis 80) ;
# plafond d'opérations par jour (HIGH_FREQUENCY) ; secondes de RAPID_SUCCESSION ; VELOCITY_CHECK : fenêtre en minutes,
# nombre de virements et montant au-dessus duquel un virement exécuté compte (strictement).
nb.fraude.score-cumule-max=75
nb.fraude.montant-eleve=5000
nb.fraude.montant-tres-eleve=15000
nb.fraude.plafond-quotidien=8
nb.fraude.succession-rapide-secondes=30
nb.fraude.velocite-fenetre-minutes=60
nb.fraude.velocite-nombre-max=5
nb.fraude.velocite-montant=500
