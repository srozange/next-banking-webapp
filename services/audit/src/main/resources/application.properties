spring.application.name=audit
server.port=8080

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-audit:5432/audit
spring.datasource.username=audit

# Jeton : tout /api/** est authentifié ; clé publique uniquement par l'environnement (NB_JETON_CLE_PUBLIQUE, DER en
# base64), sinon refus de démarrer. Le service n'expose aucun point d'API HTTP métier.

# Kafka : chaînes JSON, sans en-tête de type ; écouteur unitaire du groupe audit.
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.type=single

# Tracing : export OTLP vers le collecteur, échantillonnage complet, observation Kafka.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}] 
