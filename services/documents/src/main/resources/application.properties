spring.application.name=documents
nb.fuseau=Europe/Paris
server.port=8080

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-documents:5432/documents
spring.datasource.username=documents

# Jeton : tout /api/** est authentifié, tout rôle (le titulaire du compte seul télécharge ses documents) ; clé publique
# uniquement par l'environnement (NB_JETON_CLE_PUBLIQUE, DER en base64), sinon refus de démarrer.

# Kafka : chaînes JSON, sans en-tête de type.
spring.kafka.bootstrap-servers=kafka:9092
# documents ne produit aucun événement : il consomme coeur-bancaire.compte-modifie.v1 et identite-clients.client-modifie.v1.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=documents
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.type=single

# Tracing : export OTLP vers le collecteur, échantillonnage complet, observation Kafka.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}] 
