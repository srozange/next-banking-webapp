spring.application.name=credits
nb.fuseau=Europe/Paris
server.port=8080

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-credits:5432/credits
spring.datasource.username=credits

# Jeton : tout /api/** est authentifié, tout rôle ; clé publique uniquement par l'environnement
# (NB_JETON_CLE_PUBLIQUE, DER en base64), sinon refus de démarrer.

# Kafka : chaînes JSON, sans en-tête de type.
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000
# Kafka injoignable : l'observation de l'envoi demande l'identifiant du cluster dans le fil de la requête ;
# délais bornés pour que le POST réponde bien avant le délai de nginx (60 s).
spring.kafka.admin.operation-timeout=3s
spring.kafka.admin.properties.request.timeout.ms=3000
spring.kafka.admin.properties.default.api.timeout.ms=3000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=credits
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.type=single

# Tracing : export OTLP vers le collecteur, échantillonnage complet, observation Kafka.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}] 
