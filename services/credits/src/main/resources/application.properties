spring.application.name=credits
nb.fuseau=Europe/Paris
server.port=8080

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-credits:5432/credits
spring.datasource.username=credits

# Jeton : tout /api/** est authentifié, tout rôle ; clé publique uniquement par l'environnement
# (NB_JETON_CLE_PUBLIQUE, DER en base64), sinon refus de démarrer.

# Tracing : export OTLP vers le collecteur, échantillonnage complet.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}] 
