spring.application.name=identite-clients
server.port=8080

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-identite-clients:5432/identite_clients
spring.datasource.username=identite_clients

# Jeton : clés RSA uniquement par l'environnement (NB_JETON_CLE_PRIVEE, NB_JETON_CLE_PUBLIQUE, DER en base64),
# sinon refus de démarrer ; aucune clé par défaut.
nb.jeton.duree-de-vie=PT30M

# Tracing : export OTLP vers le collecteur, échantillonnage complet.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}] 
