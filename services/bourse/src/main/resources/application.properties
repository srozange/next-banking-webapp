spring.application.name=bourse
server.port=8080
# Fuseau métier du port Horloge.
nb.fuseau=Europe/Paris
# Fournisseur de cotations : adaptateur simulé par défaut, aucun réglage nb.fournisseurs.* versionné ; clé et adresse
# lues dans ALPHA_VANTAGE_API_KEY et ALPHA_VANTAGE_BASE_URL (variable d'environnement, puis propriété système).

# Base du service ; le mot de passe vient de l'environnement (SPRING_DATASOURCE_PASSWORD), sinon refus de démarrer.
spring.datasource.url=jdbc:postgresql://postgres-bourse:5432/bourse
spring.datasource.username=bourse

# Jeton : tout /api/** est authentifié ; clé publique uniquement par l'environnement (NB_JETON_CLE_PUBLIQUE, DER en
# base64), sinon refus de démarrer. Aucune restriction de rôle.

# Tracing : export OTLP vers le collecteur, échantillonnage complet.
management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health
# Métriques non exportées : le collecteur n'a qu'un pipeline de traces.
management.otlp.metrics.export.enabled=false
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}] 
