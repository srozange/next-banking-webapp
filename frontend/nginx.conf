# Conteneur web : renvoie /api/{identifiant}/** vers le service (chemin tel quel), sauf /api/audit/** ;
# tout autre chemin sert index.html de la SPA. Ni code métier, ni contrôle d'accès.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # DNS de Docker : les services sont résolus à chaque requête.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Le service audit n'expose aucun point d'API HTTP.
    location ~ ^/api/audit(/|$) {
        return 404;
    }

    # Liste fermée des identifiants de service (AD-14).
    location ~ ^/api/(identite-clients|coeur-bancaire|credits|documents|notifications|bourse|open-banking-conseiller)/ {
        set $service $1;
        # Sans partie URI : l'URI de la requête est transmise telle quelle.
        proxy_pass http://$service:8080;
        proxy_set_header Host $host;
        # Écrasé par l'adresse du client, jamais complété.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
